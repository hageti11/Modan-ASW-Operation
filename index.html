操作: 左スティック or WASD・矢印で操艦 / P で一時停止<br>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=i=>document.getElementById(i),cv=$('c'),ctx=cv.getContext('2d'),sc=$('sc').getContext('2d');
const rand=(a,b)=>Math.random()*(b-a)+a,D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),TAU=Math.PI*2;
const nrm=a=>{while(a<-Math.PI)a+=TAU;while(a>Math.PI)a-=TAU;return a},cl=(v,a,b)=>Math.max(a,Math.min(b,v));
let W,H,vig;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 vig=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,8,16,.6)')}
addEventListener('resize',resize);resize();
// ---- audio
let ac;const SN={ping:['sine',1500,800,.6,.2],launch:['sawtooth',450,100,.35,.14],boom:['square',120,18,.7,.25],splash:['triangle',320,80,.3,.1]};
function snd(t){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state=='suspended')ac.resume();const n=ac.currentTime,p=SN[t],o=ac.createOscillator(),g=ac.createGain();
 o.type=p[0];o.frequency.setValueAtTime(p[1],n);o.frequency.exponentialRampToValueAtTime(p[2],n+p[3]);g.gain.setValueAtTime(p[4],n);g.gain.exponentialRampToValueAtTime(.001,n+p[3]);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+p[3])}catch(e){}}
function logm(m,a){const c=$('log'),e=document.createElement('div');e.className='li'+(a?' a':'');e.textContent=m;c.appendChild(e);while(c.children.length>5)c.removeChild(c.firstChild);setTimeout(()=>e.remove(),7000)}
// ---- state
let state='title',paused=false,cam={x:0,y:0},shake=0,wave=1,score=0,waveT=0,sonarCd=0,best=0;
try{best=+localStorage.getItem('navalBest')||0}catch(e){}
let mogami,izumo,maya,ships,subs,helis,f35s,buoys,missiles,sams,torps,decoys,parts,pings;
let joy={x:0,y:0},keys={},jin={x:0,y:0},joyU={x:0,y:0},rjoy={x:0,y:0},role="surface";
const P=(x,y,c,s,l,vx,vy)=>{if(parts.length<700)parts.push({x,y,c,s,l,m:l,vx:vx??rand(-.5,.5),vy:vy??rand(-.5,.5)})};
const boom=(x,y,n=14,big=1)=>{if(typeof NET!='undefined'&&NET.on&&NET.host)Q.fx.push([x,y,n,big]);for(let i=0;i<n;i++)P(x,y,i%3?'#ffb040':'#fff6c0',rand(2,5)*big,rand(25,50),rand(-3,3)*big,rand(-3,3)*big);pings.push({x,y,r:0,m:70*big,c:'255,200,120'});snd('boom')};
// ---- ships
const SHAPE={mogami:[[0,-72],[18,-20],[18,55],[-18,55],[-18,-20]],izumo:[[0,-125],[30,-55],[30,105],[-28,105],[-28,-55]],maya:[[0,-88],[21,-25],[21,68],[-21,68],[-21,-25]]};
const COL={mogami:['#4a5b6c','#222f3d'],izumo:['#3d4d5c','#18222c'],maya:['#435465','#1d2732']};
class Ship{constructor(x,y,n,t){this.x=x;this.y=y;this.n=n;this.t=t;this.a=0;this.v=0;this.hp=100;this.dead=false;this.sam=t=='maya'?32:t=='mogami'?16:8;this.cd=0;this.roll=0;
 this.max={mogami:3.8,maya:3.2,izumo:2.6}[t];this.turn={mogami:.026,maya:.02,izumo:.015}[t];this.vla=8;this.tor=6;this.range=t=='maya'?1200:650}
 update(){
  if(this.dead){this.v*=.985;this.x+=Math.cos(this.a)*this.v;this.y+=Math.sin(this.a)*this.v;if(Math.random()<.3)P(this.x+rand(-20,20),this.y+rand(-30,30),'rgba(30,30,30,.6)',rand(6,12),60,0,-.4);return}
  this.roll=Math.sin(Date.now()*.0025+this.x*.008)*.05;
  if(this.t=='mogami'){
   if(joy.x||joy.y){const d=nrm(Math.atan2(joy.y,joy.x)-this.a);this.a+=cl(d,-this.turn,this.turn);const ts=Math.min(1,Math.hypot(joy.x,joy.y))*this.max;this.v+=this.v<ts?.04:-.04}
   else this.v=Math.max(0,this.v-.016)
  }else{
   const fo=FORM(this),dx=mogami.x+fo[0]-this.x,dy=mogami.y+fo[1]-this.y,d=Math.hypot(dx,dy);
   if(d>70){const df=nrm(Math.atan2(dy,dx)-this.a);this.a+=cl(df,-this.turn,this.turn);this.v=Math.min(this.max,d*.015)}else this.v*=.94
  }
  this.x+=Math.cos(this.a)*this.v;this.y+=Math.sin(this.a)*this.v;
  if(this.v>.5)for(let i=0;i<2;i++)P(this.x-Math.cos(this.a)*35+rand(-8,8),this.y-Math.sin(this.a)*35+rand(-8,8),'rgba(220,245,255,.4)',rand(2,5),110);
  if(this.hp<50&&Math.random()<.25)P(this.x+rand(-10,10),this.y+rand(-10,10),'rgba(40,40,40,.6)',rand(5,9),50,0,-.5);
  if(this.cd>0)this.cd--;
  for(const m of missiles){if(!m.alive)continue;const d=D(m,this);
   if(this.cd<=0&&this.sam>0&&d<this.range&&m.tg<2){this.cd=this.t=='maya'?25:55;this.sam--;m.tg++;sams.push({x:this.x,y:this.y,t:m,a:0,alive:true});logm(this.n+': 艦対空ミサイル発射');snd('launch')}
   if(d<210&&Math.random()<.05){m.alive=false;for(let i=0;i<5;i++)P(this.x+(m.x-this.x)*i/5,this.y+(m.y-this.y)*i/5,'#ffee88',2,10,0,0);boom(m.x,m.y,8,.7);logm(this.n+': CIWS 迎撃成功')}}
 }
 hull(f,b,w){ctx.beginPath();ctx.moveTo(0,-f);ctx.bezierCurveTo(w*.45,-f*.72,w,-f*.38,w,-f*.05);ctx.lineTo(w*.9,b);ctx.lineTo(-w*.9,b);ctx.lineTo(-w,-f*.05);ctx.bezierCurveTo(-w,-f*.38,-w*.45,-f*.72,0,-f);ctx.closePath()}
 draw(){
  const t=this.t,dd=this.dead,[f,b,w]={mogami:[72,55,18],izumo:[125,105,30],maya:[88,68,21]}[t];
  const R=(x,y,a,d,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,a,d)},C=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()};
  ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a+Math.PI/2+this.roll);
  ctx.save();ctx.translate(8,10);ctx.fillStyle='rgba(0,10,20,.35)';this.hull(f,b,w);ctx.fill();ctx.restore();
  ctx.strokeStyle='rgba(230,250,255,.35)';ctx.lineWidth=5;this.hull(f+2,b+2,w+2);ctx.stroke();
  if(this.v>1){ctx.strokeStyle='rgba(235,250,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-w-6,-f*.15);ctx.quadraticCurveTo(-w*.8,-f*.7,0,-f-6);ctx.quadraticCurveTo(w*.8,-f*.7,w+6,-f*.15);ctx.stroke()}
  const c=dd?['#2a2a2a','#444','#1a1a1a']:{mogami:['#3a4a5a','#6a7f94','#2c3a48'],izumo:['#2f3d4b','#566a7d','#222d38'],maya:['#34455a','#62778c','#27323f']}[t];
  const g=ctx.createLinearGradient(-w,0,w,0);g.addColorStop(0,c[0]);g.addColorStop(.5,c[1]);g.addColorStop(1,c[2]);
  ctx.fillStyle=g;this.hull(f,b,w);ctx.fill();ctx.strokeStyle='#121b24';ctx.lineWidth=2;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;this.hull(f*.9,b*.94,w*.8);ctx.stroke();
  if(t=='mogami'){
   C(0,-46,6.5,'#1b2631');R(-1.2,-64,2.4,19,'#0f171f');
   for(let i=0;i<4;i++)for(let j=0;j<2;j++)R(-8+j*9,-34+i*5,7,4,'#202c38');
   ctx.fillStyle='#55697d';ctx.beginPath();ctx.moveTo(-10,-14);ctx.lineTo(10,-14);ctx.lineTo(13,20);ctx.lineTo(-13,20);ctx.closePath();ctx.fill();ctx.strokeStyle='#26323f';ctx.lineWidth=1.5;ctx.stroke();
   R(-6,-6,12,14,'#7f93a8');R(-1,-24,2,16,'#aab9c8');C(0,2,3,'#33414f');C(0,26,3,'#cdd6de');
   C(0,41,11,'#2a3744');ctx.strokeStyle='#e8eef2';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(0,41,9,0,TAU);ctx.stroke();R(-3.5,35,1.8,12,'#e8eef2');R(1.7,35,1.8,12,'#e8eef2');R(-3.5,40.2,7,1.8,'#e8eef2');
  }else if(t=='izumo'){
   ctx.fillStyle='#5a6b7c';this.hull(f*.93,b*.96,w*.88);ctx.fill();
   ctx.strokeStyle='#e6b800';ctx.lineWidth=1.8;ctx.setLineDash([12,8]);ctx.beginPath();ctx.moveTo(-8,-f*.8);ctx.lineTo(-8,b*.9);ctx.stroke();ctx.setLineDash([]);
   ctx.strokeStyle='#fff';ctx.lineWidth=1.3;[-78,-40,-2,36,74].forEach(y=>{ctx.beginPath();ctx.arc(-8,y,7,0,TAU);ctx.stroke()});
   R(w-14,-34,10,56,'#74869a');R(w-12,-30,6,10,'#9fb0c1');R(w-10,-46,1.6,14,'#c0ccd8');C(w-9,-14,4,'#33414f');
   R(w-5,22,9,20,'#2a3642');R(-w+1,-8,9,18,'#2a3642');
   [[-18,-60],[-17,50],[10,70]].forEach(p=>{ctx.fillStyle='#8fa1b3';ctx.beginPath();ctx.ellipse(p[0],p[1],3,8,0,0,TAU);ctx.fill();R(p[0]-9,p[1]-.8,18,1.6,'rgba(210,235,250,.5)')});
   C(w-4,-62,2.5,'#18222c');C(-w+5,86,2.5,'#18222c');
  }else{
   C(0,-60,6.5,'#151d26');R(-1.2,-80,2.4,20,'#0b1118');
   for(let i=0;i<3;i++)for(let j=0;j<2;j++){R(-9+j*9,-44+i*5,8,4,'#1e2a36');R(-9+j*9,40+i*5,8,4,'#1e2a36')}
   ctx.fillStyle='#2f3c4a';ctx.beginPath();ctx.moveTo(-12,-24);ctx.lineTo(12,-24);ctx.lineTo(15,30);ctx.lineTo(-15,30);ctx.closePath();ctx.fill();ctx.strokeStyle='#1a232d';ctx.lineWidth=1.5;ctx.stroke();
   R(-8,-20,16,18,'#8196ac');R(-8,-20,8,18,'#9db2c7');R(-4,-16,8,10,'#5d7189');
   C(0,8,6,'#455668');R(-1,-34,2,18,'#aab9c8');R(-9,12,6,10,'#3a4a5a');R(3,12,6,10,'#3a4a5a');
   C(0,34,3.5,'#151d26');C(0,62,10,'#2a3744');ctx.strokeStyle='#e8eef2';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,62,8,0,TAU);ctx.stroke()
  }
  ctx.restore()}
 path(s){ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
}
class F35{constructor(i){this.o=i*Math.PI/2;this.r=900+i*120;this.x=izumo.x;this.y=izumo.y;this.a=0}
 update(){this.o+=.006;const dx=mogami.x+Math.cos(this.o)*this.r-this.x,dy=mogami.y+Math.sin(this.o)*this.r-this.y;this.a=Math.atan2(dy,dx);this.x+=Math.cos(this.a)*6.5;this.y+=Math.sin(this.a)*6.5;
  for(const s of subs)if(s.exp>0&&D(s,this)<700&&s.det<60){s.det=180;logm('F-35B: 発射位置を赤外線で捕捉',1)}
  for(const m of missiles)if(m.alive&&D(m,this)<150&&Math.random()<.03){m.alive=false;boom(m.x,m.y,8,.7);logm('F-35B: 対艦ミサイルを撃墜')}}
 draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a+Math.PI/2);ctx.fillStyle='#a0b2c6';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(9,6);ctx.lineTo(4,10);ctx.lineTo(0,7);ctx.lineTo(-4,10);ctx.lineTo(-9,6);ctx.closePath();ctx.fill();ctx.fillStyle='rgba(0,210,255,.8)';ctx.fillRect(-1.5,9,3,5);ctx.restore()}}
class Heli{constructor(s){this.s=s;this.x=s.x;this.y=s.y;this.a=0;this.pa=rand(0,TAU);this.r=rand(600,1100);this.dip=0;this.bt=0}
 update(){
  if(this.dip>0){if(--this.dip==0&&buoys.length<14){buoys.push({x:this.x,y:this.y,life:1800,t:0});logm('SH-60K: ソノブイ投下・捜索再開')}return}
  this.pa+=.008;const dx=mogami.x+Math.cos(this.pa)*this.r-this.x,dy=mogami.y+Math.sin(this.pa)*this.r-this.y;this.a=Math.atan2(dy,dx);this.x+=Math.cos(this.a)*4;this.y+=Math.sin(this.a)*4;
  if(++this.bt>350){this.bt=0;this.dip=160;logm('SH-60K: ディッピングソナー降下');
   for(const s of subs)if(D(s,this)<650){s.det=300;logm('SH-60K: 敵潜の反射音を探知!',1);snd('ping')}}}
 draw(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.a+Math.PI/2);ctx.fillStyle='#b8cbdc';ctx.beginPath();ctx.ellipse(0,0,5,16,0,0,TAU);ctx.fill();const r=Date.now()*.06;ctx.strokeStyle='rgba(210,240,255,.7)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-25*Math.cos(r),-25*Math.sin(r));ctx.lineTo(25*Math.cos(r),25*Math.sin(r));ctx.stroke();
  if(this.dip>0){ctx.strokeStyle='rgba(0,240,255,.7)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(0,0,60+Math.sin(Date.now()*.01)*8,0,TAU);ctx.stroke()}ctx.restore()}}
class Sub{constructor(){const a=rand(0,TAU),d=rand(2200,3000);this.x=mogami.x+Math.cos(a)*d;this.y=mogami.y+Math.sin(a)*d;this.a=a+Math.PI;this.hp=100;this.det=0;this.exp=0;this.cd=rand(220,420);this.dc=0;this.ph=rand(0,TAU);this.alive=true}

 if(flash>.02){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'rgba(255,0,30,0)');g.addColorStop(1,`rgba(255,20,40,${flash})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);flash*=.92}
 if(me&&state=='playing'){const hd=((me.a*180/Math.PI+90)%360+360)%360;ctx.fillStyle='rgba(8,20,32,.7)';ctx.fillRect(W/2-46,H-34,92,22);ctx.fillStyle='#8edeff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText('HDG '+String(Math.round(hd)).padStart(3,'0')+'°  '+((me.v||0)*10|0)+'kt',W/2,H-18)}}

// ===== EXTRA BLOCK v3: 味方艦の攻撃・P-1・演出 =====
const ST={fired:0,hits:0,kills:0,mc:0,mh:100,sl:0,ph:new Map()};let p1cd=0,lflash=0;
SN.alarm=['square',880,500,.45,.12];
const vib=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
const _f=fire;fire=function(v){const n=torps.length;_f(v);if(torps.length>n)ST.fired++};
const _sx=start;start=function(){_sx();ST.fired=ST.hits=ST.kills=0;ST.mc=0;ST.mh=100;ST.sl=0;ST.ph.clear();p1cd=0;logm('ヒント: ソナー・ヘリ・P-1で探知 → 魚雷で撃沈。まやといずも(ヘリ)も自動で対潜攻撃します')};
const _sw=spawnWave;spawnWave=function(){_sw();if(!NET.on&&wave%4==0&&subs.length){subs[0].hp=200;logm('警報: 大型攻撃原潜を確認(高耐久)',1)}};
const _ss=show;show=function(t,d,b,f){if(t.startsWith('作戦')&&state=='over')d+='<br>撃沈 '+ST.kills+' / 魚雷発射 '+ST.fired+' / 命中 '+ST.hits;_ss(t,d,b,f)};
const _sr=setRole;setRole=function(r){_sr(r);$('bp').style.display=r=='sub'?'none':''};
const b5=document.createElement('button');b5.className='btn';b5.id='bp';b5.style.gridColumn='1/3';b5.innerHTML='P-1 哨戒機<small>[B] 前方にソノブイ5基散布</small>';$('btns').appendChild(b5);b5.onclick=()=>cmd(4);
addEventListener('keydown',e=>{if(e.code=='KeyB')cmd(4)});
function p1(){if(state!='playing'||mogami.dead)return;if(p1cd>0){logm('P-1 再出撃準備中',1);return}p1cd=1800;
 for(let i=1;i<=5;i++)buoys.push({x:mogami.x+Math.cos(mogami.a)*(400+i*380)+rand(-120,120),y:mogami.y+Math.sin(mogami.a)*(400+i*380)+rand(-120,120),life:1800,t:0});logm('P-1哨戒機: 前方にソノブイ5基散布');snd('launch')}
function asroc(s,tg){torps.push({x:s.x,y:s.y,a:Math.atan2(tg.y-s.y,tg.x-s.x),v:8.5,fly:true,fd:cl(D(tg,s)-130,150,1500),life:900,alive:true});s.asr--;s.ac=420;ST.fired++;logm(s.n+': アスロック発射!');snd('launch')}
function extraSim(){
 if(p1cd>0)p1cd--;const tgs=subs.filter(u=>u.alive&&u.det>0);
 ships.forEach(s=>{if(s.dead)return;if(s.asr===undefined){s.asr=s.t=='maya'?8:0;s.ac=0;s.gc=0;s.rc=0}
  if(s.ac>0)s.ac--;
  if(s.t!='mogami'&&s.asr>0&&s.ac<=0){let b=null;for(const u of tgs)if(D(u,s)<3000&&(!b||D(u,s)<D(b,s)))b=u;if(b)asroc(s,b)}
  if(++s.rc>300){s.rc=0;if(s.hp<100)s.hp=Math.min(100,s.hp+1)}
  if(s.t!='izumo'&&s.gc<=0){for(const m of missiles){if(m.alive&&D(m,s)<650&&Math.random()<.5){s.gc=40;const a=Math.atan2(m.y-s.y,m.x-s.x);for(let i=1;i<6;i++)P(s.x+Math.cos(a)*(40+i*30),s.y+Math.sin(a)*(40+i*30),'#ffe9a0',2,8,0,0);if(Math.random()<.18){m.alive=false;boom(m.x,m.y,8,.7);logm(s.n+': 127mm砲で迎撃')}break}}}else s.gc--});
 helis.forEach(h=>{h.tc=(h.tc||300)-1;if(h.dip>0||h.tc>0)return;for(const u of tgs)if(D(u,h)<520){torps.push({x:h.x,y:h.y,a:Math.atan2(u.y-h.y,u.x-h.x),v:3.8,fly:false,fd:0,life:500,alive:true});h.tc=900;ST.fired++;logm('SH-60K: 短魚雷を投下!');snd('splash');break}});
 missiles.forEach(m=>{if(m.alive&&!m.ch&&m.t&&D(m,m.t)<280){m.ch=1;if(Math.random()<.3){m.alive=false;for(let i=0;i<10;i++)P(m.x,m.y,'#e8f4ff',rand(3,6),50);boom(m.x,m.y,6,.6);logm(m.t.n+': チャフ欺瞞成功!')}}});
 if(missiles.length>ST.mc)snd('alarm');ST.mc=missiles.length;
 if(mogami.hp<ST.mh)vib(90);ST.mh=mogami.hp;
 subs.forEach(u=>{const p=ST.ph.get(u);if(p!==undefined&&u.hp<p)ST.hits++;ST.ph.set(u,u.hp)});
 if(subs.length<ST.sl)ST.kills+=ST.sl-subs.length;ST.sl=subs.length}
// ---- overlay (昼夜・雨・ラベル・警告矢印)
const sp=o=>({x:W/2+(o.x-cam.x)*zoom,y:H/2+(o.y-cam.y)*zoom});
function overlay(){if(state=='title')return;const T=Date.now()*.001;
 ctx.fillStyle=`rgba(0,6,24,${.3*(1-Math.cos(T/40))/2})`;ctx.fillRect(0,0,W,H);
 if(!NET.on&&wave>0&&wave%3==0){ctx.strokeStyle='rgba(200,225,255,.25)';ctx.lineWidth=1;ctx.beginPath();for(let i=0;i<90;i++){const x=(i*131.7)%W,y=(i*57.3+T*520)%H;ctx.moveTo(x,y);ctx.lineTo(x-4,y+14)}ctx.stroke();
  if(lflash<=0&&Math.random()<.002){lflash=7;snd('boom')}}
 if(lflash>0){ctx.fillStyle=`rgba(255,255,255,${lflash/16})`;ctx.fillRect(0,0,W,H);lflash--}
 ctx.textAlign='center';
 ships.forEach(s=>{if(fog(s))return;const p=sp(s);if(p.x<-100||p.x>W+100||p.y<-150||p.y>H+150)return;const oy=s.t=='izumo'?-138:s.t=='maya'?-100:-84;
  ctx.font='bold 10px sans-serif';ctx.fillStyle='rgba(220,245,255,.9)';ctx.fillText(s.n.replace(/^(護衛艦|ヘリ空母|イージス艦)/,''),p.x,p.y+oy*zoom);
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(p.x-22,p.y+oy*zoom+4,44,4);ctx.fillStyle=s.hp>60?'#00e0a0':s.hp>30?'#ffb020':'#ff3344';ctx.fillRect(p.x-22,p.y+oy*zoom+4,44*Math.max(0,s.hp)/100,4)});
 if(role!='sub'){subs.forEach(u=>{if(!(u.det>0))return;const lab='SUB '+Math.round(D(u,mogami)*2)+'m';if(1){const p=sp(u),r=34+Math.sin(T*6)*3;ctx.strokeStyle='#ff2244';ctx.lineWidth=2;ctx.beginPath();[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(c=>{ctx.moveTo(p.x+c[0]*r,p.y+c[1]*(r-12));ctx.lineTo(p.x+c[0]*r,p.y+c[1]*r);ctx.lineTo(p.x+c[0]*(r-12),p.y+c[1]*r)});ctx.stroke();ctx.fillStyle='#ff6677';ctx.font='bold 11px sans-serif';ctx.fillText(lab,p.x,p.y+r+14)}});
  }
 ctx.textAlign='left';
 if(p1cd>=0&&$('bp'))$('bp').firstChild.textContent=p1cd>0?'P-1 再出撃まで '+Math.ceil(p1cd/60)+'s':'P-1 哨戒機';
}
const _dr=draw;draw=function(){_dr();overlay()};

// ===== BLOCK v4: 陣営交代 / 潜水艦魚雷 / 難易度 / 陣形 =====
let etorps=[],formIdx=0;
const FORMS=[['単横陣',[0,-380],[0,380]],['単縦陣',[-380,0],[-760,0]],['輪形陣',[-120,-330],[220,330]],['密集陣',[-180,-180],[-180,180]]];
function FORM(s){const f=FORMS[formIdx],o=s.t=='izumo'?f[1]:f[2],a=mogami.a,c=Math.cos(a),n=Math.sin(a);return [c*o[0]-n*o[1],n*o[0]+c*o[1]]}
const diff=()=>{const v=+$('df').value;return v>=0&&v<=2?v:1};
function cycForm(){formIdx=(formIdx+1)%FORMS.length;logm('陣形変更: '+FORMS[formIdx][0])}
function subTorp(s){if(!(s.tp>0)||s.tcd>0){logm(s.tp>0?'魚雷 再装填中':'魚雷 弾切れ',1);return}
 let b=null,ba=9;for(const t of ships){if(t.dead||D(t,s)>1500)continue;const d=Math.abs(nrm(Math.atan2(t.y-s.y,t.x-s.x)-s.a))+D(t,s)/6000;if(d<ba){ba=d;b=t}}
 etorps.push({x:s.x,y:s.y,a:b?Math.atan2(b.y-s.y,b.x-s.x):s.a,v:4.6,fly:false,life:700,e:1,alive:true});s.tp--;s.tcd=240;s.det=Math.max(s.det,150);s.exp=Math.max(s.exp,150);
 logm('警報: 敵潜水艦が魚雷を発射!'+(b?' 目標 '+b.n:''),1);snd('alarm')}
function etSim(){subs.forEach(u=>{if(u.tcd>0)u.tcd--});
 etorps=etorps.filter(q=>{if(--q.life<=0)return false;let b=null,bd=420;for(const s of ships)if(!s.dead&&D(s,q)<bd){bd=D(s,q);b=s}
  if(b)q.a+=cl(nrm(Math.atan2(b.y-q.y,b.x-q.x)-q.a),-.04,.04);q.x+=Math.cos(q.a)*q.v;q.y+=Math.sin(q.a)*q.v;P(q.x,q.y,'rgba(255,120,120,.5)',rand(1,2),20);
  for(const t of torps)if(!t.fly&&t.alive&&D(t,q)<24){t.alive=false;boom(q.x,q.y,10,.8);logm('味方魚雷が敵魚雷を迎撃!');return false}
  if(b&&bd<40){b.hp-=40;shake=24;boom(q.x,q.y,20,1.5);vib(120);logm('被弾: '+b.n+' に魚雷命中!',1);if(b.hp<=0&&!b.dead){b.dead=true;b.hp=0;logm(b.n+' 大破・航行不能!',1)}return false}
  return true})}
function diffTick(){if(NET.on)return;const d=diff();subs.forEach(u=>{if(u.human)return;if(d==2)u.cd-=.5;else if(d==0)u.cd+=.3;
 if(d>0){u.tc2=(u.tc2===undefined?500:u.tc2)-1;if(u.tc2<=0){let b=null;for(const s of ships)if(!s.dead&&D(s,u)<1100&&(!b||D(s,u)<D(b,u)))b=s;u.tc2=d==2?600:1000;
  if(b){etorps.push({x:u.x,y:u.y,a:Math.atan2(b.y-u.y,b.x-u.x),v:4.4,fly:false,life:600,e:1,alive:true});u.det=Math.max(u.det,200);logm('警報: 敵潜が魚雷を発射!',1);snd('alarm')}}}})}
const _ex=extraSim;extraSim=function(){_ex();etSim();diffTick()};
const _sw2=spawnWave;spawnWave=function(){_sw2();if(!NET.on){const d=diff();subs.forEach(u=>{u.hp=Math.round(u.hp*[.5,1,1.5][d])})}};
const _s4=start;start=function(){_s4();etorps=[];formIdx=0};
const _so=startOnline;startOnline=function(a,b){_so(a,b);subs.forEach(s=>{if(s.human){s.tp=4;s.tcd=0;s.hp=[130,100,70][diff()]}})};
function doSwap(){if(!NET.on||!NET.host||state!='playing')return;const prev=role;role=prev=='sub'?'surface':'sub';setRole(role);rjoy={x:0,y:0};try{NET.conn.send({role:prev})}catch(e){}logm('陣営交代: あなたは'+(role=='sub'?'潜水艦':'水上艦隊')+'側')}
function swapReq(){if(!NET.on||state!='playing')return;if(NET.host)doSwap();else NET.conn&&NET.conn.send({sw:1})}
const _sr2=setRole;setRole=function(r){_sr2(r);const sub=r=='sub';$('bp').style.display=$('bf').style.display=sub?'none':'';if(sub){$('bv').style.display='';$('bv').innerHTML='潜水艦魚雷<small>[V] 前方の艦を追尾</small>'}};
const bf=document.createElement('button');bf.className='btn';bf.id='bf';bf.style.gridColumn='1/3';bf.innerHTML='陣形<small>[F] 切替</small>';$('btns').appendChild(bf);bf.onclick=()=>cmd(5);
const bx=document.createElement('button');bx.className='btn';bx.id='bx';bx.style.cssText='position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:8px;padding:6px 10px;display:none;z-index:5';bx.textContent='陣営交代 [X]';document.body.appendChild(bx);bx.onclick=swapReq;
addEventListener('keydown',e=>{if(e.code=='KeyF')cmd(5);else if(e.code=='KeyX')swapReq()});
const _hd=hud;hud=function(){_hd();const sb=subs.find(u=>u.human);if(role=='sub'&&sb)$('ns').textContent=Math.round(Math.max(0,sb.hp))+' / 魚雷'+(sb.tp||0);$('bf').firstChild.textContent='陣形: '+FORMS[formIdx][0];$('bx').style.display=NET.on?'':'none'};
const _ov=overlay;overlay=function(){_ov();if(state=='title')return;[...torps,...etorps].forEach(q=>{if(!q.e)return;const p=sp(q);ctx.strokeStyle='#ff4455';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,9*zoom,0,TAU);ctx.stroke()})};

show('NAVAL OPS 現代艦隊対潜・対空演習',$('od').innerHTML,'作戦開始',start);requestAnimationFrame(loop);
